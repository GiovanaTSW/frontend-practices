<html>
    <head>
        <style>
            div {
                padding: 30px;
                border-radius: 50%;
                width: 50px;
                background-color: #007bff;
                color: white;
                animation-name: colorChange;
                animation-duration: 4s;
            }

            @keyframes colorChange {
                from { background-color: #007bff;}
                to {background-color: #f2106e;}
            }
        </style>
    </head>
    <body>
        <div>Disco!</div>
    </body>
</html>

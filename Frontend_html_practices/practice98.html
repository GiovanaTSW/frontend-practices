<html>
    <head>
        <style>
            .serif-font {
                font-family: serif;
            }

            .sans-serif-font {
                font-family: sans-serif;
            }

            .monospace-font {
                font-family: monospace;
            }

            .cursive-font {
                font-family: cursive;
            }

            .fantasy-font {
                font-family: fantasy;
            }

            body {
                background-color: #0C1527;
                color: #FFFFFF;
            }
        </style>
    </head>

    <body>
        <h2 class="serif-font">This is a serif font.</h2>
        <h2 class="sans-serif-font">This is a sans-serif font.</h2>
        <h2 class="monospace-font">This is monospace font.</h2>
        <h2 class="cursive-font">This is a cursive font.</h2>
        <h2 class="fantasy-font">This is a fantasy font.</h2>
    </body>
</html>

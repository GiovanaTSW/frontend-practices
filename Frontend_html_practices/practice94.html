<html>
    <head>
        <style>
            .capitalize {
                text-transform: capitalize;
            }

            .uppercase {
                text-transform: uppercase;
            }

            .lowercase {
                text-transform: lowercase;
            }

            body {
                background-color: #000A23;
                color: white;
            }
        </style>
    </head>

    <body>
        <p class="capitalize">
            this is a sentence with capitalize transformation.
        </p>

        <p class="uppercase">
            this is sentence with uppercase transformation.
        </p>

        <p class="lowercase">
            THIS IS A SENTENCE WITH LOWER TRANSFORMATION.
        </p>
    </body>
</html>

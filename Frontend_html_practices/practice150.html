<html>
    <head>
        <style>
            button {
                padding: 10px 20px;
                font-size: 16px;
                margin: 30px;
                border: none;
                border-radius: 5px;
                background-color: #3498db;
                color: #ffffff;
                transition: transform 1s;
            }

            button:active {
                transform: scale(1.3);
            }
        </style>
    </head>
    <body>
        <button>Press & Hold</button>
    </body>
</html>

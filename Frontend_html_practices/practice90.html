<html>
    <head>
       <style>
        .parent {
            font-size: 20px;
            background-color: #98FB98;
        }

        .child {
            font-size: 50%;
            background-color: #FFD700;
        }
       </style> 
    </head>

    <body>
        <div class="parent">
            Parent Text (20px)

            <div class="child">
                Child Text (50% of Parent = 10px)
            </div>
        </div>
    </body>
</html>

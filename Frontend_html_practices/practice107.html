<html>
    <head>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #F3F4F6;
                color: #333;
            }

            table {
                border-collapse: collapse;
            }

            tr:nth-child(odd) {
                background-color: #E9E9E9;
            }

            tr:nth-child(even) {
                background-color: #FFFFFF;
            }

            th, td {
                border: 2px solid #909092;
            }
        </style>
    </head>
    <body>
        <table>
            <tr>
                <th>Rank</th>
                <th>Movie Title</th>
                <th>Box Office Collection (in $ millions)</th>
            </tr>
            <tr>
                <td>1</td>
                <td>Avatar</td>
                <td>2,847</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Avengers: Endgame</td>
                <td>2,798</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Titanic</td>
                <td>2,202</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Star Wars: The Force Awakens</td>
                <td>2,068</td>
            </tr>
        </table>
    </body>
</html>

<html>
    <head>
        <style>
            p {
                font-family: Arial, sans-serif;
                font-size: 1.5em;
            }

            #light {
                font-weight: 100;
            }

            #normal {
                font-weight: 400;
            }

            #bold {
                font-weight: 700;
            }

            #bolder {
                font-weight: 900;
            }
        </style>
    </head>

    <body>
        <p id="light">This is light text.</p>
        <p id="normal">This is normal text.</p>
        <p id="bold">This is bold text.</p>
        <p id="bolder">This is bolder text.</p>
    </body>
</html>

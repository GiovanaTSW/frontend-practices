<html>
    <head>
        <style>
            .card:active {
                transform: rotate(30deg);
                transform-origin: top left;
            }

            .card {
                position: absolute;
                width: 150px;
                height: 150px;
                background-color: #3494db;
                border-radius: 20px;
                margin-left: 81px;
                margin-top: 1px;
                z-index: 10;
            }

            .empty {
                height: 150px;
                width: 150px;
                margin: 80px;
                border: 1px solid black;
            }
        </style>
    </head>
    <body>
        <div class="card"></div>
        <div class="empty"></div>
    </body>
</html>

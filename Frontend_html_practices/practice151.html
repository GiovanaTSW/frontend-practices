<html>
    <head>
        <style>
            #element {
                width: 100px;
                background-color: blue;
                color: white;
                transition: width 2s, background-color 1s;
                transition-delay: 2s;
            }

            #element:active {
                width: 200px;
                background-color: red;
            }
        </style>
    </head>
    <body>
        <div id="element">Press & hold at least 2 seconds</div>
    </body>
</html>

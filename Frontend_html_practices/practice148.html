<html>
    <head>
        <style>
            #box {
                width: 100px;
                height: 100px;
                background-color: #4169e1;
                transition: width 1s, height 1s, background-color 1s;
            }

            #box:active {
                width: 150px;
                height: 150px;
                background-color: #dc143c;
            }
        </style>
    </head>
    <body>
        <div id="box">Press & Hold</div>
    </body>
</html>
